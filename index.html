<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Panel de Gestión — Seguridad</title>
<meta name="description" content="Dashboard de gestión para empresa de seguridad privada.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<style>
:root{
  --bg:#eef1f6;--card:#fff;--ink:#14161c;--sub:#6b7280;--line:rgba(20,22,28,.08);
  --accent:#ff7a1a;--ok:#22c55e;--off:#9ca3af;--bad:#ef4444;--dark:#15171d;
  --r:26px;--shadow:0 10px 30px rgba(20,22,40,.08);
  --glass:rgba(255,255,255,.16);--glass-b:rgba(255,255,255,.35);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg) center/cover fixed no-repeat;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Intro & Login ---------- */
.fs{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;background:#000}
.fs video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fs::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.1),rgba(0,0,0,.55))}
.intro-logo{position:relative;z-index:2;width:min(46vw,220px);opacity:0;transform:scale(.7);animation:logoIn 2.8s ease forwards;filter:drop-shadow(0 10px 40px rgba(255,255,255,.35))}
.intro-logo::after{content:""}
.shine{position:absolute;z-index:3;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);background-size:250% 100%;animation:shine 1.4s .9s ease forwards;opacity:0}
@keyframes logoIn{0%{opacity:0;transform:scale(.7)}30%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.25)}}
@keyframes shine{0%{opacity:1;background-position:150% 0}100%{opacity:0;background-position:-50% 0}}
.fade-out{animation:fadeOut .6s ease forwards}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);box-shadow:0 20px 60px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4)}
.login-card{position:relative;z-index:2;width:min(92vw,380px);border-radius:34px;padding:34px 26px 28px;color:#fff;text-align:center}
.login-card img{width:84px;height:84px;object-fit:contain;margin:0 auto 14px;border-radius:22px}
.login-card h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.login-card p{opacity:.8;font-size:14px;margin:4px 0 22px}
.field{position:relative;margin-bottom:12px}
.field input{width:100%;height:52px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);padding:0 52px 0 20px;color:#fff;outline:none}
.field input::placeholder{color:rgba(255,255,255,.7)}
.field input:focus{border-color:#fff;background:rgba(255,255,255,.22)}
.eye{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff}
.btn-go{width:100%;height:54px;border-radius:999px;background:#fff;color:#111;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;transition:transform .15s}
.btn-go:active{transform:scale(.97)}
.btn-go .arr{width:34px;height:34px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center}
.err{color:#fecaca;font-size:13px;min-height:18px;margin-top:10px}

/* ---------- Layout ---------- */
#app{min-height:100vh;padding:16px 14px 110px}
.nav{position:fixed;z-index:20;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:8px;border-radius:999px;background:rgba(21,23,29,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:0 12px 40px rgba(0,0,0,.3);max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#a1a1aa;transition:.2s}
.nav button.on{background:#fff;color:#111}
.nav button svg{width:22px;height:22px}
.nav .lbl{display:none}
@media(min-width:900px){
  #app{padding:24px 28px 28px 128px}
  .nav{left:18px;top:18px;bottom:18px;transform:none;flex-direction:column;border-radius:32px;padding:14px 10px;justify-content:flex-start;overflow-y:auto}
}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.top h2{font-size:26px;font-weight:800;letter-spacing:-.03em}
.top small{display:block;color:var(--sub);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{height:40px;padding:0 16px;border-radius:999px;background:#fff;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.pill.dark{background:var(--dark);color:#fff}
.pill.acc{background:var(--accent);color:#fff}
.pill.bad{background:#fee2e2;color:#b91c1c}
.pill:disabled{opacity:.5}
.pill svg{width:18px;height:18px}
.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.offline{background:#fef3c7;color:#92400e;border-radius:16px;padding:10px 14px;font-size:13px;margin-bottom:12px;font-weight:600}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.grid.g2{grid-template-columns:1fr 1fr}.grid.g3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.grid.g4{grid-template-columns:repeat(4,1fr)}.grid.home{grid-template-columns:1.1fr 1fr 1fr}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .mut{font-weight:500}
.mut{color:var(--sub);font-size:13px}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em}
.metric{display:flex;flex-direction:column;gap:4px}
.metric .ic{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:#fff4ec;color:var(--accent);margin-bottom:6px}
.bar{height:10px;border-radius:99px;background:#eef0f4;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#ffb36b);transition:width .6s}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal b{color:var(--sub);font-weight:600;font-size:11px;padding:4px 0}
.cal button{aspect-ratio:1;border-radius:12px;font-weight:600}
.cal button.today{background:var(--dark);color:#fff}
.cal button.sel{outline:2px solid var(--accent)}
.cal button.dim{color:#cbd0d8}
.cal button.has::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--accent);margin:-2px auto 0}
/* avatars */
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#e5e7eb;flex:0 0 auto;display:grid;place-items:center;font-weight:700;color:#555;font-size:14px;position:relative}
.av-wrap{position:relative;display:inline-block}
.dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:var(--off)}
.dot.in{background:var(--ok)}
.avs{display:flex;flex-wrap:wrap;gap:10px}
/* notif */
.list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
.ni{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:16px;background:#f7f8fa}
.ni.new{background:#fff4ec}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#eef2ff;color:#3730a3;text-transform:capitalize}
.badge.personal{background:#dcfce7;color:#166534}.badge.vehicular{background:#dbeafe;color:#1e40af}
.cnt{background:var(--bad);color:#fff;border-radius:99px;padding:2px 8px;font-size:12px}
/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.person{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:16px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.person .av{width:64px;height:64px;font-size:20px}
.person .dot{width:16px;height:16px}
/* tables */
.tw{overflow:auto;border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--sub);font-weight:600;font-size:12px;position:sticky;top:0;background:#fff}
.ib{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;background:#f3f4f6}
.ib svg{width:16px;height:16px}
.ib.del{color:var(--bad)}
/* form */
.in,select.in,textarea.in{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:#f7f8fa;padding:0 14px;outline:none}
textarea.in{height:90px;padding:12px 14px;resize:vertical}
.in:focus{border-color:var(--accent);background:#fff}
label.l{display:block;font-size:12px;color:var(--sub);font-weight:600;margin:10px 0 4px}
.seg{display:inline-flex;background:#eef0f4;border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
/* timeline */
.tl{border-left:2px solid #eef0f4;margin-left:8px;padding-left:16px;display:flex;flex-direction:column;gap:12px}
.tl div{position:relative}
.tl div::before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff}
.tl div.out::before{background:var(--dark)}
/* modal */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(10,12,20,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:14px}
.mbox{width:min(96vw,520px);max-height:90vh;overflow:auto;border-radius:30px;padding:22px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mbox h3{font-size:18px;margin-bottom:8px}
.toast{position:fixed;z-index:70;left:50%;top:16px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);transition:.3s}
/* preview */
.preview{background:#d9dde5;border-radius:22px;padding:12px;overflow:hidden;min-height:200px}
.preview-inner{transform-origin:top left;transition:transform .6s ease}
.preview .apn-hoja{margin:0 auto 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);background:#fff}
.empty{padding:30px;text-align:center;color:var(--sub)}
.chartbox{position:relative;height:220px}

/* editor de horas del cuaderno */
.erow{display:grid;grid-template-columns:104px 104px 1fr auto;gap:8px;margin-bottom:8px;align-items:start}
.erow .eh{padding:9px 4px;text-align:center}
.erow .et{resize:vertical;min-height:44px;line-height:1.35}
.erow.sistema .et{color:#1b0fa6}.erow.dato .et{color:#e0383c}
.erow .ea{display:flex;gap:4px}.erow .ea button{width:34px;height:34px;border-radius:10px;background:#eef0f4;font-size:15px}
.erow.edit .et{background:#fff7ed}
@media(max-width:700px){.erow{grid-template-columns:100px 100px 1fr}.erow .ea{grid-column:1/4;justify-content:flex-end}}
</style>
</head>
<body>

<!-- INTRO -->
<section id="intro" class="fs" aria-label="Inicio">
  <video id="vIntro" autoplay muted loop playsinline></video>
  <img id="introLogo" class="intro-logo" alt="Logotipo" crossorigin="anonymous">
  <div class="shine"></div>
</section>

<!-- LOGIN -->
<section id="login" class="fs hidden" aria-label="Iniciar sesión">
  <video id="vLogin" autoplay muted loop playsinline></video>
  <form id="loginForm" class="login-card glass" autocomplete="on">
    <img id="loginLogo" alt="Logotipo" crossorigin="anonymous">
    <h1 id="loginTitle">Bienvenido</h1>
    <p>Ingresa a tu panel de gestión</p>
    <div class="field"><label class="sr" for="lu">Usuario</label><input id="lu" placeholder="Usuario" autocomplete="username" required></div>
    <div class="field"><label class="sr" for="lp">Contraseña</label><input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="button" class="eye" id="eye" aria-label="Mostrar contraseña"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button class="btn-go" id="loginBtn" type="submit">Ingresar <span class="arr">→</span></button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <nav class="nav" id="nav" aria-label="Secciones"></nav>
  <div id="offline" class="offline hidden">Sin conexión — mostrando la última copia guardada.</div>
  <main id="view"></main>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>
<div id="toast" class="toast hidden" role="status"></div>

<script src="apn-config.js"></script>
<script>
/* =================== CONFIGURACIÓN =================== */
const API_URL = (window.APN_CONFIG && APN_CONFIG.API_URL) || "AQUI_VA_MI_LINK";
const REPORTES_URL = (window.APN_CONFIG && APN_CONFIG.REPORTES_URL) || "../apn-reportes.js";   // la librería de hojas A4 está una carpeta arriba (ver guía de GitHub). Si la subes a otro sitio, pon aquí el link completo.
const FONDO_URL = (window.APN_CONFIG && APN_CONFIG.FONDO_URL) || "";
const VIDEO_INICIO_URL = (window.APN_CONFIG && APN_CONFIG.VIDEO_INICIO_URL) || "https://cdn.coverr.co/videos/coverr-city-traffic-at-night-1579/1080p.mp4";
const VIDEO_LOGIN_URL = (window.APN_CONFIG && APN_CONFIG.VIDEO_LOGIN_URL) || "https://cdn.coverr.co/videos/coverr-aerial-view-of-a-city-at-night-5363/1080p.mp4";
const LOGO_URL = (window.APN_CONFIG && APN_CONFIG.LOGO_URL) || "https://cdn-icons-png.flaticon.com/512/1680/1680012.png";
const LOGO_PIE_URL      = (window.APN_CONFIG && APN_CONFIG.LOGO_PIE_URL) || "https://i.postimg.cc/rmn8xM0b/0oyjs-Z4.png";   // imagen que va al final de las hojas de personal, vehicular y visitas
const PORTADA_PERSONAL_URL = (window.APN_CONFIG && APN_CONFIG.PORTADA_PERSONAL_URL) || "";   // link de la imagen de la pasta del cuaderno de personal
const PORTADA_VEHICULAR_URL = (window.APN_CONFIG && APN_CONFIG.PORTADA_VEHICULAR_URL) || "";   // link de la pasta del cuaderno vehicular
const PORTADA_VISITAS_URL = (window.APN_CONFIG && APN_CONFIG.PORTADA_VISITAS_URL) || "";   // link de la pasta del cuaderno de visitas
const PORTADA_CUADERNO_URL = (window.APN_CONFIG && APN_CONFIG.PORTADA_CUADERNO_URL) || "";   // link de la pasta del cuaderno de ocurrencias
const ROLES = ["admin","agente","limpieza","trabajador","conductor"];
/* ===================================================== */

const LS = {
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const S = {
  token: sessionStorage.getItem("apn_token")||"",
  user: JSON.parse(sessionStorage.getItem("apn_user")||"null"),
  data: LS.get("apn_cache",null),
  modifiedAt: "",
  view: "inicio",
  selDate: hoy(),
  calMonth: new Date(),
  notifs: LS.get("apn_notifs",[]),
  seenIds: null,
  timer: null,
  lastUpd: null,
  rep: {tipo:"personal", semana:lunes(new Date()), trabajador:"", fecha:hoy(), turno:"dia", limpieza:false, hora:"", libro:true},
  persona: null, buscar:{q:"",desde:"",hasta:"",mod:""}, vbuscar:{q:"",desde:"",hasta:""}
};
const cfgLocal = () => ({fondo:LS.get("apn_fondo",FONDO_URL), vIntro:LS.get("apn_vintro",VIDEO_INICIO_URL), vLogin:LS.get("apn_vlogin",VIDEO_LOGIN_URL), logo:LS.get("apn_logo",LOGO_URL), intervalo:LS.get("apn_int",4)});

/* ---------- utils ---------- */
function $(s,r=document){return r.querySelector(s)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function hoy(){return ymd(new Date())}
function lunes(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return ymd(x)}
function addDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d)}
function hms(d){return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add("hidden"),2600)}
function isAdmin(){return (S.user?.rol||"").toLowerCase()==="admin"}
function ini(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()}
function avatar(p,size){const u=p?.fotoUrl;return u?`<img class="av" ${size?`style="width:${size}px;height:${size}px"`:""} src="${esc(u)}" crossorigin="anonymous" alt="${esc(p.nombre)}" loading="lazy" onerror="this.outerHTML='<span class=&quot;av&quot;>${esc(ini(p.nombre))}</span>'">`:`<span class="av" ${size?`style="width:${size}px;height:${size}px"`:""}>${esc(ini(p?.nombre))}</span>`}
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000|0);if(s<60)return"hace "+s+" s";if(s<3600)return"hace "+(s/60|0)+" min";if(s<86400)return"hace "+(s/3600|0)+" h";return"hace "+(s/86400|0)+" d"}

/* Campos tolerantes de los registros (los HTML pueden usar nombres distintos) */
const F = {
  fecha:r=>{const v=r.fecha||r.date||r.timestamp||r.createdAt||"";if(/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);const d=new Date(v);if(!isNaN(d))return ymd(d);const m=String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${pad(m[2])}-${pad(m[1])}`:""},
  hora:r=>{const v=r.hora||r.time||"";if(v)return String(v).slice(0,5);const d=new Date(r.timestamp||r.createdAt||"");return isNaN(d)?"":pad(d.getHours())+":"+pad(d.getMinutes())},
  nombre:r=>r.nombre||r.trabajador||r.persona||r.conductor||r.usuario||"",
  tipo:r=>r.tipo||r.movimiento||r.accion||"",
  ingreso:r=>/ingres|entrad|in$/i.test(F.tipo(r)),
  salida:r=>/salid|out$/i.test(F.tipo(r)),
  ts:r=>{const d=new Date(F.fecha(r)+"T"+(F.hora(r)||"00:00")+":00");return isNaN(d)?0:d.getTime()}
};
const mods = () => S.data?.modulos||{};
const regs = m => (mods()[m]||[]);
const personas = () => S.data?.personas||[];
const vehiculos = () => S.data?.vehiculos||[];
const config = () => S.data?.config||{};

/* ---------- API ---------- */
async function api(action,data={}){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,token:S.token,data})});
  const j=await r.json();
  if(j.status==="auth"){logout("Sesión expirada");throw new Error("auth")}
  if(j.status==="pin"){toast("PIN incorrecto");throw new Error("pin")}
  if(j.status!=="success")throw new Error(j.message||"Error del servidor");
  return j;
}
async function getData(force){
  const btn=$("#refBtn");btn&&btn.classList.add("spin");
  try{
    const u=`${API_URL}?action=getData&token=${encodeURIComponent(S.token)}&since=${encodeURIComponent(force?"":S.modifiedAt)}`;
    const r=await fetch(u);const j=await r.json();
    if(j.status==="auth"){logout("Sesión expirada");return}
    if(j.status!=="success")throw new Error(j.message);
    $("#offline").classList.add("hidden");
    S.lastUpd=new Date();
    if(j.unchanged&&!force){updStamp();return}
    detectNew(j);
    S.data=j;S.modifiedAt=j.modifiedAt||"";LS.set("apn_cache",j);
    render(true);
  }catch(e){
    if(e.message==="auth")return;
    $("#offline").classList.remove("hidden");
    if(!S.data)S.data=LS.get("apn_cache",null);
  }finally{btn&&btn.classList.remove("spin");updStamp()}
}
function updStamp(){const el=$("#stamp");if(el)el.textContent="Última actualización: "+(S.lastUpd?hms(S.lastUpd):"—")}
function startPolling(){clearInterval(S.timer);const s=Math.min(5,Math.max(3,+cfgLocal().intervalo||4));S.timer=setInterval(()=>getData(false),s*1000)}

function detectNew(j){
  const ids=new Set();const nuevos=[];
  for(const [m,arr] of Object.entries(j.modulos||{}))for(const r of arr||[]){const k=m+":"+(r.id??JSON.stringify(r));ids.add(k);if(S.seenIds&&!S.seenIds.has(k))nuevos.push({m,r})}
  if(S.seenIds===null&&!LS.get("apn_seen_init",false)){LS.set("apn_seen_init",true)}
  if(S.seenIds)for(const {m,r} of nuevos){S.notifs.unshift({id:Date.now()+Math.random(),m,txt:`${F.nombre(r)||"Alguien"} registró ${(F.tipo(r)||"un dato").toLowerCase()}`,ts:Date.now(),leida:false})}
  S.notifs=S.notifs.slice(0,80);LS.set("apn_notifs",S.notifs);S.seenIds=ids;
}

function sections(){

  n.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.v==="salir")return logout();S.view=b.dataset.v;S.persona=null;buildNav();render();scrollTo({top:0,behavior:"smooth"})};

let navKeys="";

/* ---------- Render principal ---------- */
const charts={};
function killCharts(){for(const k in charts){charts[k].destroy();delete charts[k]}}
function render(fromData){
  const k=Object.keys(mods()).join(",");if(k!==navKeys){navKeys=k;buildNav()}
  // no re-render formularios en edición
  if(fromData&&["usuarios","flota","empresa","ajustes"].includes(S.view)&&document.activeElement?.closest?.("#view"))return;
  if(fromData&&S.view==="reportes"){renderPreview();return}
  killCharts();
  const v=$("#view");const V=S.view;
  if(V==="inicio")v.innerHTML=vInicio();
  else if(V==="personal")v.innerHTML=S.persona?vPerfil():vPersonal();
  else if(V==="buscar")v.innerHTML=vBuscar();
  else if(V==="vehiculos")v.innerHTML=vVehiculos();
  else if(V==="reportes")v.innerHTML=vReportes();
  else if(V.startsWith("mod:"))v.innerHTML=vModulo(V.slice(4));
  else if(V==="usuarios")v.innerHTML=vUsuarios();
  else if(V==="flota")v.innerHTML=vFlota();
  else if(V==="empresa")v.innerHTML=vEmpresa();
  else if(V==="ajustes")v.innerHTML=vAjustes();
  $("#refBtn")&&($("#refBtn").onclick=()=>getData(true));

/* ---------- INICIO ---------- */
function estadoHoy(fecha){
  const rs=regs("personal").filter(r=>F.fecha(r)===fecha).sort((a,b)=>F.ts(a)-F.ts(b));
  const last={};for(const r of rs)last[F.nombre(r)]=r;
  return {rs,last};
}
function vInicio(){
  const f=S.selDate;const {rs,last}=estadoHoy(f);
  const ing=rs.filter(F.ingreso),sal=rs.filter(F.salida);
  const dentro=Object.values(last).filter(F.ingreso).length;
  const vr=regs("vehicular").filter(r=>F.fecha(r)===f).sort((a,b)=>F.ts(a)-F.ts(b));
  const vl={};for(const r of vr)vl[r.placa||r.vehiculo||""]=r;
  const enRuta=Object.values(vl).filter(F.salida).length;
  const total=Object.values(mods()).reduce((a,x)=>a+(x?.length||0),0);
  const unread=S.notifs.filter(n=>!n.leida).length;
  const cfg=config();
  return header(cfg.tituloEmpresa||"Inicio",(f===hoy()?"Hoy, ":"")+new Date(f+"T00:00:00").toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"}))+`
  <div class="grid g4" style="margin-bottom:14px">
    ${met("Total de registros",total,"reportes")}${met("Ingresos del día",ing.length,"personal")}${met("Salidas del día",sal.length,"salir")}${met("Personal dentro",dentro,"usuarios")}
  </div>
  <div class="grid home">
    <div class="card"><h3><span id="calT"></span><span class="row"><button class="ib" id="calP" aria-label="Mes anterior">‹</button><button class="ib" id="calN" aria-label="Mes siguiente">›</button></span></h3><div class="cal" id="cal"></div></div>
    <div class="grid">
      <div class="card"><h3>Horas de jornada <span class="mut" id="jIni"></span></h3><div class="big" id="jornada">00:00:00</div><div class="bar" style="margin-top:12px"><i id="jBar" style="width:0"></i></div><p class="mut" style="margin-top:8px">Meta: 12 h desde el primer ingreso</p></div>
      <div class="card"><h3>Miembros <span class="mut">${dentro} dentro · ${met2(enRuta)}</span></h3><div class="avs">${personas().filter(p=>p.activo!==false).map(p=>{const r=last[p.nombre];return `<button class="av-wrap" data-pid="${esc(p.id)}" title="${esc(p.nombre)}">${avatar(p)}<span class="dot ${r&&F.ingreso(r)?"in":""}"></span></button>`}).join("")||'<span class="mut">Sin personas</span>'}</div></div>
    </div>
    <div class="card"><h3>Notificaciones ${unread?`<span class="cnt">${unread}</span>`:""}<button class="mut" id="markRead">Marcar leídas</button></h3><div class="list">${S.notifs.map(n=>`<div class="ni ${n.leida?"":"new"}"><div style="flex:1"><span class="badge ${esc(n.m)}">${esc(n.m)}</span><div style="font-size:14px;margin-top:4px">${esc(n.txt)}</div><div class="mut">${ago(n.ts)}</div></div></div>`).join("")||'<div class="empty">Sin novedades</div>'}</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Movimientos de la semana</h3><div class="chartbox"><canvas id="chBar"></canvas></div></div>
    <div class="card"><h3>Distribución del día <span class="mut">${enRuta} vehículos en ruta</span></h3><div class="chartbox"><canvas id="chDona"></canvas></div></div>
  </div>`;
}
function met2(n){return n+" vehículos en ruta"}
function met(t,v,ic){return `<div class="card metric"><span class="ic">${svg(ic)}</span><span class="mut">${t}</span><span class="big">${v}</span></div>`}
let jornTimer=null;
const bind={};
bind.inicio=()=>{
  drawCal();
  $("#calP").onclick=()=>{S.calMonth.setMonth(S.calMonth.getMonth()-1);drawCal()};
  $("#calN").onclick=()=>{S.calMonth.setMonth(S.calMonth.getMonth()+1);drawCal()};
  $("#markRead").onclick=()=>{S.notifs.forEach(n=>n.leida=true);LS.set("apn_notifs",S.notifs);render()};
  document.querySelectorAll("[data-pid]").forEach(b=>b.onclick=()=>{S.view="personal";S.persona=b.dataset.pid;buildNav();render()});
  const {rs}=estadoHoy(S.selDate);const first=rs.find(F.ingreso);
  clearInterval(jornTimer);
  if(first){
    const t0=F.ts(first);$("#jIni").textContent="desde "+F.hora(first);
    const tick=()=>{const el=$("#jornada");if(!el)return clearInterval(jornTimer);const end=S.selDate===hoy()?Date.now():F.ts(rs[rs.length-1]);const s=Math.max(0,(end-t0)/1000|0);el.textContent=pad(s/3600|0)+":"+pad((s%3600)/60|0)+":"+pad(s%60);$("#jBar").style.width=Math.min(100,s/432)+"%"};
    tick();jornTimer=setInterval(tick,1000);
  }else $("#jIni").textContent="sin ingresos";
  whenChart(()=>{
    const days=[...Array(7)].map((_,i)=>addDays(lunes(new Date(S.selDate+"T00:00:00")),i));
    const P=regs("personal"),Vh=regs("vehicular");
    charts.bar=new Chart($("#chBar"),{type:"bar",data:{labels:["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"],datasets:[
      {label:"Ingresos",data:days.map(d=>P.filter(r=>F.fecha(r)===d&&F.ingreso(r)).length),backgroundColor:"#ff7a1a",borderRadius:10},
      {label:"Salidas",data:days.map(d=>P.filter(r=>F.fecha(r)===d&&F.salida(r)).length),backgroundColor:"#15171d",borderRadius:10},
      {label:"Vehicular",data:days.map(d=>Vh.filter(r=>F.fecha(r)===d).length),backgroundColor:"#c7cbd4",borderRadius:10}]},
      options:chartOpts()});
    const {last}=estadoHoy(S.selDate);const dentro=Object.values(last).filter(F.ingreso).length;const total=personas().filter(p=>p.activo!==false).length;
    charts.dona=new Chart($("#chDona"),{type:"doughnut",data:{labels:["Dentro","Fuera"],datasets:[{data:[dentro,Math.max(0,total-dentro)],backgroundColor:["#22c55e","#e5e7eb"],borderWidth:0}]},options:{maintainAspectRatio:false,cutout:"72%",plugins:{legend:{position:"bottom"}}}});
  });
};
function chartOpts(){return {maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10,usePointStyle:true}}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{precision:0},grid:{color:"#f0f1f4"}}}}}
function whenChart(fn){if(window.Chart)fn();else{const i=setInterval(()=>{if(window.Chart){clearInterval(i);if(document.querySelector("canvas"))fn()}},200)}}
function drawCal(){
  const m=S.calMonth,y=m.getFullYear(),mo=m.getMonth();
  $("#calT").textContent=m.toLocaleDateString("es",{month:"long",year:"numeric"});
  const first=new Date(y,mo,1),start=(first.getDay()+6)%7,days=new Date(y,mo+1,0).getDate();
  const conDatos=new Set(Object.values(mods()).flat().map(F.fecha));
  let h=["L","M","X","J","V","S","D"].map(d=>`<b>${d}</b>`).join("");
  for(let i=0;i<start;i++)h+="<span></span>";
  for(let d=1;d<=days;d++){const s=`${y}-${pad(mo+1)}-${pad(d)}`;h+=`<button data-d="${s}" class="${s===hoy()?"today":""} ${s===S.selDate?"sel":""} ${conDatos.has(s)?"has":""}" aria-label="${s}">${d}</button>`}
  const c=$("#cal");c.innerHTML=h;c.onclick=e=>{const b=e.target.closest("[data-d]");if(!b)return;S.selDate=b.dataset.d;render()};
}

/* ---------- PERSONAL ---------- */
function vPersonal(){
  const {last}=estadoHoy(hoy());
  return header("Personal","Toca a un trabajador para ver su perfil")+`<div class="people">${personas().map(p=>{const r=last[p.nombre];return `<button class="person" data-pid="${esc(p.id)}"><span class="av-wrap">${avatar(p,64)}<span class="dot ${r&&F.ingreso(r)?"in":""}"></span></span><b style="font-size:14px">${esc(p.nombre)}</b><span class="badge">${esc(p.rol)}</span></button>`}).join("")||'<div class="card empty">Aún no hay trabajadores</div>'}</div>`;
}
bind.personal=()=>{
  document.querySelectorAll("[data-pid]").forEach(b=>b.onclick=()=>{S.persona=b.dataset.pid;render()});
  $("#back")&&($("#back").onclick=()=>{S.persona=null;render()});
  bindRegActions("personal");
  if(S.persona){
    const p=personas().find(x=>String(x.id)===String(S.persona));if(!p)return;
    const rs=regs("personal").filter(r=>F.nombre(r)===p.nombre);
    const days=[...Array(7)].map((_,i)=>addDays(lunes(new Date()),i));
    whenChart(()=>{charts.p=new Chart($("#chP"),{type:"bar",data:{labels:["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"],datasets:[{label:"Horas",data:days.map(d=>horasDia(rs,d)),backgroundColor:"#ff7a1a",borderRadius:10}]},options:chartOpts()})});
  }
};
function horasDia(rs,d){const x=rs.filter(r=>F.fecha(r)===d).sort((a,b)=>F.ts(a)-F.ts(b));let t=0,inn=null;for(const r of x){if(F.ingreso(r))inn=F.ts(r);else if(F.salida(r)&&inn){t+=F.ts(r)-inn;inn=null}}return +(t/3600000).toFixed(2)}
function vPerfil(){
  const p=personas().find(x=>String(x.id)===String(S.persona));if(!p){S.persona=null;return vPersonal()}
  const rs=regs("personal").filter(r=>F.nombre(r)===p.nombre).sort((a,b)=>F.ts(b)-F.ts(a));
  const fechas=[...new Set(rs.map(F.fecha))].slice(0,14);
  const semana=[...Array(7)].map((_,i)=>horasDia(rs,addDays(lunes(new Date()),i))).reduce((a,b)=>a+b,0);
  return `<div class="top"><button class="pill" id="back">‹ Volver</button><div class="row"><span class="mut" id="stamp"></span><button class="pill" id="refBtn">${svg("ref")} Actualizar</button></div></div>
  <div class="grid g3">
    <div class="card" style="text-align:center">${avatar(p,96).replace('class="av"','class="av" style="margin:0 auto;width:96px;height:96px"')}<h2 style="margin-top:10px">${esc(p.nombre)}</h2><span class="badge">${esc(p.rol)}</span>
      <div class="grid g2" style="margin-top:16px;text-align:left"><div><span class="mut">Movimientos</span><div class="big">${rs.length}</div></div><div><span class="mut">Horas semana</span><div class="big">${semana.toFixed(1)}</div></div></div>
      <div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,semana/48*100)}%"></i></div><p class="mut" style="margin-top:6px">de 48 h semanales</p></div>
    <div class="card"><h3>Línea de tiempo</h3><div class="tl" style="max-height:340px;overflow:auto">${rs.slice(0,30).map(r=>`<div class="${F.salida(r)?"out":""}"><b>${esc(F.tipo(r))}</b> · ${esc(F.hora(r))}<div class="mut">${esc(F.fecha(r))}${r.motivo?" — "+esc(r.motivo):""}</div></div>`).join("")||'<span class="mut">Sin movimientos</span>'}</div></div>
    <div class="card"><h3>Horas por semana</h3><div class="chartbox"><canvas id="chP"></canvas></div><div style="margin-top:10px">${fechas.slice(0,7).map(d=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span class="mut">${d}</span><b>${horasDia(rs,d)} h</b></div>`).join("")}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Todos los movimientos</h3>${regTable("personal",rs)}</div>`;
}

/* ---------- Tablas de registros ---------- */
function regCols(arr){const s=new Set();arr.slice(0,50).forEach(r=>Object.keys(r).forEach(k=>s.add(k)));s.delete("id");return [...s].slice(0,12)}
function regTable(mod,arr){
  if(!arr.length)return '<div class="empty">Sin registros</div>';
  const cols=regCols(arr);
  return `<div class="tw" style="max-height:60vh"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}${isAdmin()?"<th></th>":""}</tr></thead><tbody>${arr.slice(0,500).map(r=>`<tr>${cols.map(c=>`<td>${cell(r[c])}</td>`).join("")}${isAdmin()?`<td><button class="ib" data-edit="${esc(r.id)}" data-mod="${esc(mod)}" aria-label="Editar">${svg("edit")}</button> <button class="ib del" data-del="${esc(r.id)}" data-mod="${esc(mod)}" aria-label="Borrar">${svg("del")}</button></td>`:""}</tr>`).join("")}</tbody></table></div>${arr.length>500?'<p class="mut">Mostrando 500 de '+arr.length+'</p>':""}`;

function filtrar(arr,f){const q=f.q.trim().toLowerCase();return arr.filter(r=>{const d=F.fecha(r);if(f.desde&&d<f.desde)return false;if(f.hasta&&d>f.hasta)return false;if(q&&!Object.values(r).join(" ").toLowerCase().includes(q))return false;return true}).sort((a,b)=>F.ts(b)-F.ts(a))}

function csv(rows,name){
  if(!rows.length)return toast("No hay datos para descargar");
  const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  const q=v=>{const s=v==null?"":typeof v==="object"?JSON.stringify(v):String(v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const txt="\ufeff"+cols.join(";")+"\n"+rows.map(r=>cols.map(c=>q(r[c])).join(";")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

  box.oninput=e=>{if(e.target.dataset.f){S.eDirty=true;e.target.closest(".erow").classList.add("edit")}};
  const ed0=()=>{const e=JSON.parse(JSON.stringify(cuaderno.ediciones||{}));e.textos=e.textos||{};e.extras=e.extras||[];e.ocultas=e.ocultas||[];return e};
  const guardar=async ed=>{try{await api("saveCuaderno",{fecha:S.rep.fecha,turno:S.rep.turno,ediciones:ed});S.eDirty=false;toast("Cuaderno actualizado");cuadLista=null;$("#cEdit").innerHTML="";renderPreview()}catch(e){if(e.message!=="auth"&&e.message!=="pin")toast(e.message)}};
  const horaOk=v=>v===""||/^([01]\d|2[0-3]):[0-5]\d$/.test(v);
  $("#eSave").onclick=()=>{
    const ed=ed0();let mal=false;
    box.querySelectorAll(".erow").forEach(r=>{
      const k=r.dataset.k,cur={};let cambio=false;
      r.querySelectorAll("[data-f]").forEach(i=>{if(i.value!==i.dataset.v){cur[i.dataset.f]=i.value;cambio=true;if((i.dataset.f==="hi"||i.dataset.f==="hs")&&!horaOk(i.value))mal=true}});
      if(!cambio)return;
      if(k.startsWith("x:")){const x=ed.extras.find(z=>"x:"+z.id===k);if(x)Object.assign(x,cur)}
      else ed.textos[k]=Object.assign(ed.textos[k]||{},cur);
    });
    if(mal)return toast("Las horas deben ser HH:MM (ejemplo 08:30)");
    guardar(ed);
  };
  $("#eAdd").onclick=()=>modal(`<h3>Agregar fila al cuaderno</h3>
    <label class="l" for="xH">Hora (toca para abrir el reloj)</label><input id="xH" class="in" type="time">
    <label class="l" for="xT">Texto</label><textarea id="xT" class="in" rows="3" placeholder="Qué ocurrió"></textarea>
    <label class="l" for="xC">Color</label><select id="xC" class="in"><option value="dato">Dato registrado (rojo)</option><option value="sistema">Texto del sistema (azul)</option></select>
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="pill" data-close>Cancelar</button><button class="pill dark" id="xOk">Agregar</button></div>`);
  $("#eAdd").addEventListener("click",()=>setTimeout(()=>{const ok=$("#xOk");if(!ok)return;ok.onclick=()=>{
    const h=$("#xH").value.trim(),tx=$("#xT").value.trim();
    if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(h)||!tx)return toast("Pon una hora válida (HH:MM) y el texto");
    const ed=ed0();ed.extras.push({id:Date.now().toString(36),hi:h,hs:"",texto:tx,tipo:$("#xC").value});closeModal();guardar(ed)}},0));
  box.onclick=e=>{
    const b=e.target.closest("[data-a]");if(!b)return;
    const k=b.closest(".erow").dataset.k,ed=ed0();
    if(b.dataset.a==="rest"){delete ed.textos[k];guardar(ed)}
    else if(k.startsWith("x:")){ed.extras=ed.extras.filter(z=>"x:"+z.id!==k);delete ed.textos[k];guardar(ed)}
    else confirmar("¿Quitar esta fila del cuaderno? (el registro original no se borra)",async()=>{ed.ocultas.push(k);await guardar(ed)});
  };
}
addEventListener("resize",()=>{clearTimeout(fitPreview._t);fitPreview._t=setTimeout(fitPreview,120)});

/* ---------- TRABAJADORES Y USUARIOS ---------- */
function vUsuarios(){
  return header("Trabajadores y usuarios","Los formularios de registro toman a las personas de aquí")+`<div class="row" style="margin-bottom:14px"><button class="pill dark" id="newP">+ Nueva persona</button></div>
  <div class="card"><div class="tw"><table><thead><tr><th></th><th>Nombre</th><th>Rol</th><th>Usuario</th><th>Firma</th><th>Activo</th><th></th></tr></thead><tbody>${personas().map(p=>`<tr><td>${avatar(p,34)}</td><td><b>${esc(p.nombre)}</b></td><td><span class="badge">${esc(p.rol)}</span></td><td>${esc(p.usuario||"—")}</td><td>${p.firmaUrl?`<img src="${esc(p.firmaUrl)}" crossorigin="anonymous" style="height:26px" alt="Firma">`:"—"}</td><td>${p.activo===false?"No":"Sí"}</td><td><button class="ib" data-pe="${esc(p.id)}" aria-label="Editar">${svg("edit")}</button> ${["admin","agente"].includes(p.rol)?`<button class="ib" data-pk="${esc(p.id)}" aria-label="Cambiar contraseña">🔑</button>`:""} <button class="ib del" data-pd="${esc(p.id)}" aria-label="Eliminar">${svg("del")}</button></td></tr>`).join("")||'<tr><td colspan="7" class="empty">Sin personas</td></tr>'}</tbody></table></div></div>`;
}
bind.usuarios=()=>{
  $("#newP").onclick=()=>formPersona({});
  document.querySelectorAll("[data-pe]").forEach(b=>b.onclick=()=>formPersona(personas().find(p=>String(p.id)===b.dataset.pe)||{}));
  document.querySelectorAll("[data-pd]").forEach(b=>b.onclick=()=>confirmar("¿Eliminar a esta persona?",async()=>{await api("deletePersona",{id:b.dataset.pd});toast("Persona eliminada");getData(true)}));
  document.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{modal(`<h3>Cambiar contraseña</h3><form id="mf"><label class="l">Nueva contraseña</label><input class="in" name="clave" type="password" required minlength="4" autocomplete="new-password"><div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="pill" data-close>Cancelar</button><button class="pill dark">Guardar</button></div></form>`);$("#mf").onsubmit=async e=>{e.preventDefault();try{await api("setClave",{id:b.dataset.pk,clave:e.target.clave.value});closeModal();toast("Contraseña actualizada")}catch(err){toast(err.message)}}});
};
function formPersona(p){
  modal(`<h3>${p.id?"Editar":"Nueva"} persona</h3><form id="mf">
  <label class="l">Nombre completo</label><input class="in" name="nombre" required value="${esc(p.nombre||"")}">
  <label class="l">Rol</label><select class="in" name="rol" id="fRol">${ROLES.map(r=>`<option ${p.rol===r?"selected":""}>${r}</option>`).join("")}</select>
  <div id="fCred"><label class="l">Usuario</label><input class="in" name="usuario" value="${esc(p.usuario||"")}" autocomplete="off">
  <label class="l">Contraseña ${p.id?"(dejar vacío para no cambiar)":""}</label><input class="in" name="clave" type="password" autocomplete="new-password"></div>
  <label class="l">Link de foto</label><input class="in" name="fotoUrl" type="url" value="${esc(p.fotoUrl||"")}" placeholder="https://…">
  <div id="fFirma"><label class="l">Link de imagen de firma</label><input class="in" name="firmaUrl" type="url" value="${esc(p.firmaUrl||"")}" placeholder="https://…"></div>
  <div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="pill" data-close>Cancelar</button><button class="pill dark">Guardar</button></div></form>`);
  const sync=()=>{const r=$("#fRol").value;$("#fCred").classList.toggle("hidden",!["admin","agente"].includes(r));$("#fFirma").classList.toggle("hidden",!["admin","agente"].includes(r))};
  $("#fRol").onchange=sync;sync();
  $("#mf").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const persona={...(p.id?{id:p.id}:{}),rol:d.rol,nombre:d.nombre.trim(),fotoUrl:d.fotoUrl||""};
    if(["admin","agente"].includes(d.rol)){persona.usuario=d.usuario.trim();if(d.clave)persona.clave=d.clave;persona.firmaUrl=d.firmaUrl||""}
    try{await api("savePersona",{persona});closeModal();toast("Guardado");getData(true)}catch(err){toast(err.message)}};
}

/* ---------- FLOTA ---------- */
function vFlota(){
  return header("Administrar vehículos","Los formularios de registro toman los vehículos de aquí")+`<div class="row" style="margin-bottom:14px"><button class="pill dark" id="newV">+ Nuevo vehículo</button></div>
  <div class="grid g3">${vehiculos().map(v=>`<div class="card"><div class="row" style="justify-content:space-between"><div><div class="big" style="font-size:24px">${esc(v.placa)}</div><div class="mut">${esc(v.descripcion||"")}</div></div><div><button class="ib" data-ve="${esc(v.id)}" aria-label="Editar">${svg("edit")}</button> <button class="ib del" data-vd="${esc(v.id)}" aria-label="Eliminar">${svg("del")}</button></div></div></div>`).join("")||'<div class="card empty">Sin vehículos</div>'}</div>`;
}
bind.flota=()=>{
  const form=v=>{modal(`<h3>${v.id?"Editar":"Nuevo"} vehículo</h3><form id="mf"><label class="l">Placa</label><input class="in" name="placa" required value="${esc(v.placa||"")}" style="text-transform:uppercase"><label class="l">Descripción</label><input class="in" name="descripcion" value="${esc(v.descripcion||"")}"><div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="pill" data-close>Cancelar</button><button class="pill dark">Guardar</button></div></form>`);
    $("#mf").onsubmit=async e=>{e.preventDefault();try{await api("saveVehiculo",{vehiculo:{...(v.id?{id:v.id}:{}),placa:e.target.placa.value.trim().toUpperCase(),descripcion:e.target.descripcion.value.trim()}});closeModal();toast("Guardado");getData(true)}catch(err){toast(err.message)}}};
  $("#newV").onclick=()=>form({});
  document.querySelectorAll("[data-ve]").forEach(b=>b.onclick=()=>form(vehiculos().find(v=>String(v.id)===b.dataset.ve)||{}));
  document.querySelectorAll("[data-vd]").forEach(b=>b.onclick=()=>confirmar("¿Eliminar este vehículo?",async()=>{await api("deleteVehiculo",{id:b.dataset.vd});toast("Vehículo eliminado");getData(true)}));
};

/* ---------- EMPRESA ---------- */
function vEmpresa(){
  const c=config();
  const f=(n,l,t="text")=>`<label class="l" for="e_${n}">${l}</label><input class="in" id="e_${n}" name="${n}" type="${t}" value="${esc(c[n]||"")}">`;
  return header("Empresa","Datos que aparecen en reportes y formularios")+`<div class="grid g2"><form class="card" id="empF">
    ${f("tituloEmpresa","Nombre de la empresa")}<label class="l" for="e_desc">Descripción</label><textarea class="in" id="e_desc" name="descripcionEmpresa">${esc(c.descripcionEmpresa||"")}</textarea>
    ${f("unidad","Unidad / sede")}${f("fotoEmpresaUrl","Link de foto de la empresa","url")}${f("logoUrl","Link del logo","url")}${f("logoPieUrl","Imagen al pie de las hojas (personal, vehicular y visitas) — link","url")}${f("portadaPersonalUrl","Link de portada: Control de personal","url")}${f("portadaVehicularUrl","Link de portada: Control vehicular","url")}${f("portadaVisitasUrl","Link de portada: Control de visitas","url")}${f("portadaCuadernoUrl","Link de portada: Cuaderno de ocurrencias","url")}${f("supervisorNombre","Nombre del supervisor")}${f("firmaSupervisorUrl","Link de firma del supervisor","url")}
    <button class="pill dark" style="margin-top:16px">Guardar</button></form>
    <div class="card" style="text-align:center">${c.fotoEmpresaUrl?`<img src="${esc(c.fotoEmpresaUrl)}" crossorigin="anonymous" alt="Foto de la empresa" style="width:100%;max-height:220px;object-fit:cover;border-radius:18px">`:""}
      ${c.logoUrl?`<img src="${esc(c.logoUrl)}" crossorigin="anonymous" alt="Logo" style="height:80px;margin:16px auto">`:""}<h2>${esc(c.tituloEmpresa||"Tu empresa")}</h2><p class="mut" style="margin-top:6px">${esc(c.descripcionEmpresa||"")}</p>
      ${c.firmaSupervisorUrl?`<img src="${esc(c.firmaSupervisorUrl)}" crossorigin="anonymous" alt="Firma" style="height:60px;margin:18px auto 4px">`:""}<div class="mut">${esc(c.supervisorNombre||"")}</div></div></div>`;
}
bind.empresa=()=>{$("#empF").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api("saveConfig",{config:d});toast("Empresa actualizada");document.activeElement.blur();getData(true)}catch(err){toast(err.message)}}};

function vAjustes(){
  const c=cfgLocal();
  return header("Ajustes","Se guardan en este dispositivo")+`<div class="grid g2"><form class="card" id="ajF">
    <label class="l" for="aF">Link de fondo del dashboard</label><input class="in" id="aF" name="fondo" type="url" value="${esc(c.fondo)}">
    <label class="l" for="aI">Link del video de inicio</label><input class="in" id="aI" name="vIntro" type="url" value="${esc(c.vIntro)}">
    <label class="l" for="aL">Link del video de login</label><input class="in" id="aL" name="vLogin" type="url" value="${esc(c.vLogin)}">
    <label class="l" for="aLo">Link del logotipo</label><input class="in" id="aLo" name="logo" type="url" value="${esc(c.logo)}">
    <label class="l" for="aT">Actualizar cada (segundos)</label><select class="in" id="aT" name="intervalo">${[3,4,5].map(n=>`<option ${+c.intervalo===n?"selected":""}>${n}</option>`).join("")}</select>
    <button class="pill dark" style="margin-top:16px">Guardar ajustes</button></form>
    <div class="card"><h3>Cambiar PIN de edición</h3>${isAdmin()?`<form id="pinF"><label class="l">PIN actual</label><input class="in" name="pin" type="password" inputmode="numeric" required autocomplete="off"><label class="l">Nuevo PIN</label><input class="in" name="nuevoPin" type="password" inputmode="numeric" required minlength="4" autocomplete="off"><button class="pill acc" style="margin-top:16px">Cambiar PIN</button></form>`:'<p class="mut">Solo el administrador puede cambiar el PIN.</p>'}
    <h3 style="margin-top:22px">Sesión</h3><p class="mut">${esc(S.user?.nombre||S.user?.usuario||"")} · ${esc(S.user?.rol||"")}</p><button class="pill bad" id="outB" style="margin-top:10px">Cerrar sesión</button></div></div>`;
}
bind.ajustes=()=>{
  $("#ajF").onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));LS.set("apn_fondo",d.fondo);LS.set("apn_vintro",d.vIntro);LS.set("apn_vlogin",d.vLogin);LS.set("apn_logo",d.logo);LS.set("apn_int",+d.intervalo);applyFondo();startPolling();toast("Ajustes guardados")};
  $("#pinF")&&($("#pinF").onsubmit=async e=>{e.preventDefault();try{await api("setPin",{pin:e.target.pin.value,nuevoPin:e.target.nuevoPin.value});e.target.reset();toast("PIN actualizado")}catch(err){if(err.message!=="pin")toast(err.message)}});
  $("#outB").onclick=()=>logout();
};

/* ---------- Modal ---------- */
function modal(html){$("#mbox").innerHTML=html;$("#modal").classList.remove("hidden");setTimeout(()=>$("#mbox input,#mbox select")?.focus(),50)}
function closeModal(){$("#modal").classList.add("hidden");$("#mbox").innerHTML=""}
$("#modal").onclick=e=>{if(e.target.id==="modal"||e.target.closest("[data-close]"))closeModal()};
addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function confirmar(msg,fn){modal(`<h3>${esc(msg)}</h3><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="pill" data-close>Cancelar</button><button class="pill bad" id="okB">Confirmar</button></div>`);$("#okB").onclick=async()=>{try{await fn();closeModal()}catch(e){toast(e.message)}}}

/* ---------- Arranque ---------- */
addEventListener("online",()=>getData(true));
addEventListener("offline",()=>$("#offline").classList.remove("hidden"));
intro();
</script>
